name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Ensure platform 34
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          export PATH=/opt/gradle-8.2/bin:$PATH
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SnakeGame.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin apk 2>/dev/null || true
          git checkout -B apk origin/apk 2>/dev/null || git checkout --orphan apk
          git rm -rf --quiet . 2>/dev/null || true
          cp /tmp/SnakeGame.apk SnakeGame.apk
          git add -f SnakeGame.apk
          git commit -m "auto publish apk" || echo "no change"
          git push -f origin apk
